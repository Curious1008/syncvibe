[package]
name = "syncvibe-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
getrandom = "0.2"
base64 = "0.22"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
