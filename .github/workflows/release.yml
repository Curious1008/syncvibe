name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p syncvibe
          else
            cargo build --release --target ${{ matrix.target }} -p syncvibe
          fi

      - name: Strip binary
        run: |
          BIN="target/${{ matrix.target }}/release/syncvibe"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # For cross-compiled binaries, use llvm-strip
            llvm-strip "$BIN" 2>/dev/null || true
          else
            strip "$BIN"
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../syncvibe-${{ matrix.target }}.tar.gz syncvibe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncvibe-${{ matrix.target }}
          path: syncvibe-${{ matrix.target }}.tar.gz

  universal-macos:
    name: Universal macOS binary
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: syncvibe-*-apple-darwin
          merge-multiple: false

      - name: Create universal binary
        run: |
          mkdir -p arm64 x86_64 universal

          tar xzf syncvibe-aarch64-apple-darwin/syncvibe-aarch64-apple-darwin.tar.gz -C arm64
          tar xzf syncvibe-x86_64-apple-darwin/syncvibe-x86_64-apple-darwin.tar.gz -C x86_64

          lipo -create arm64/syncvibe x86_64/syncvibe -output universal/syncvibe

          cd universal
          tar czf ../syncvibe-darwin-universal.tar.gz syncvibe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncvibe-darwin-universal
          path: syncvibe-darwin-universal.tar.gz

  release:
    name: Create Release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: syncvibe-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## Install

            ```bash
            curl -fsSL https://syncvibe.online/install.sh | sh
            ```

            ## What's New

            ### Screen Sharing
            - `/share` — toggle sharing your agent pane with teammates
            - `/watch <name>` — view a teammate's shared agent screen in real time
            - Delta-encoded frames over WebSocket for efficient bandwidth

            ### New Slash Commands
            - `/new` (`/n`) — create a new room without leaving TUI
            - `/join` (`/j`) — join with invite code from within TUI
            - `/chats` — switch between rooms
            - `/leave` — leave current room with cleanup

            ### @Mention Improvements
            - Tab + Enter completion for @mentions
            - AI agents appear in autocomplete alongside teammates
            - `@agent` sends tasks directly to your AI agent pane

            ### Toast Notifications
            - Status bar toast system for non-intrusive notifications
            - Agent connection events shown as toasts instead of chat messages

            ### UX Improvements
            - Community prompt (GitHub + Discord) shown once on 2nd room creation
            - Invite code retry loop — invalid codes no longer crash the process
            - Room name validation with retry on invalid characters
            - File paths (drag-and-drop) no longer treated as slash commands
            - One-time "did you know?" tips rotating in the status bar

            ### Security
            - CSRF nonce for OAuth authorization flow
            - Panic hook for graceful error recovery
            - Room secrets use 0600 permissions

            ### Bug Fixes
            - Fix key bridge thread stealing stdin during prompt flows
            - Fix initial load showing "connected" messages in chat
            - Fix agent not appearing in @mention autocomplete

            ## Platforms
            | File | Platform |
            |------|----------|
            | `syncvibe-darwin-universal.tar.gz` | macOS (Apple Silicon + Intel) |
            | `syncvibe-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon |
            | `syncvibe-x86_64-apple-darwin.tar.gz` | macOS Intel |
            | `syncvibe-x86_64-unknown-linux-gnu.tar.gz` | Linux x86_64 |
            | `syncvibe-aarch64-unknown-linux-gnu.tar.gz` | Linux ARM64 |
          files: |
            syncvibe-aarch64-apple-darwin.tar.gz
            syncvibe-x86_64-apple-darwin.tar.gz
            syncvibe-darwin-universal.tar.gz
            syncvibe-x86_64-unknown-linux-gnu.tar.gz
            syncvibe-aarch64-unknown-linux-gnu.tar.gz
